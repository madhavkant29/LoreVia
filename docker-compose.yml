version: "3.9"
services:
  api:
    build: { context: ./backend, dockerfile: Dockerfile.api }
    ports: ["8000:8000"]
    env_file: ./backend/.env
    depends_on: [redis]

  worker-extraction:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    env_file: ./backend/.env
    depends_on: [redis]
    command: celery -A app.workers.celery_app worker -Q extraction -c 4 --loglevel=info

  worker-analysis:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    env_file: ./backend/.env
    depends_on: [redis]
    command: celery -A app.workers.celery_app worker -Q analysis,embedding -c 2 --loglevel=info

  worker-intelligence:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    env_file: ./backend/.env
    depends_on: [redis]
    command: celery -A app.workers.celery_app worker -Q intelligence -c 1 --loglevel=info

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  flower:
    image: mher/flower
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports: ["5555:5555"]
    depends_on: [redis]
