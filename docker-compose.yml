version: "3.9"
services:
  api:
    build: { context: ./backend, dockerfile: Dockerfile.api }
    ports: ["8000:8000"]
    env_file: ./backend/.env

  worker:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    env_file: ./backend/.env
    command: celery -A app.workers.celery_app worker -Q intelligence,analysis,embedding,extraction -c 4 -Ofair --loglevel=info

  flower:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    env_file: ./backend/.env
    command: celery -A app.workers.celery_app flower --port=5555
    ports: ["5555:5555"]
