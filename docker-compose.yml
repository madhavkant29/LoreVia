x-release-build-args: &release-build-args
  RELEASE_SHA: ${RELEASE_SHA:-unknown}
  SECURITY_REFRESH: ${SECURITY_REFRESH:-unknown}

x-runtime-hardening: &runtime-hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev

services:
  nginx:
    <<: *runtime-hardening
    build:
      context: .
      dockerfile: ops/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      EDGE_PROXY_SECRET: ${EDGE_PROXY_SECRET:?EDGE_PROXY_SECRET is required}
    volumes:
      - ./ops/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:8443/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - edge
      - app

  backend:
    <<: *runtime-hardening
    build:
      context: .
      dockerfile: backend/Dockerfile.api
      args: *release-build-args
    # LOREVIA_ENV_FILE defaults to ./backend/.env for local/VPS use.
    # Override for managed deployments: set LOREVIA_ENV_FILE=/etc/lorevia/lorevia.env
    env_file:
      - ${LOREVIA_ENV_FILE:-./backend/.env}
    environment:
      DEPLOYMENT_ENV: "production"
      EDGE_PROXY_SECRET: ${EDGE_PROXY_SECRET:?EDGE_PROXY_SECRET is required}
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
      DATABASE_STATEMENT_TIMEOUT_MS: "30000"
      DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: "30000"
      DATABASE_SLOW_QUERY_LOG_MS: "750"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app
      - redis_internal

  redis:
    <<: *runtime-hardening
    build:
      context: .
      dockerfile: ops/redis/Dockerfile
    user: "999:1000"
    restart: unless-stopped
    # Load REDIS_PASSWORD from the same env file used by the app services so
    # plain `docker compose up` works on a VPS without an extra --env-file flag.
    env_file:
      - ${LOREVIA_ENV_FILE:-./backend/.env}
    command:
      [
        "sh",
        "-ec",
        "umask 077; printf 'appendonly yes\\nappendfsync everysec\\nrequirepass %s\\n' \"$${REDIS_PASSWORD}\" > /tmp/redis.conf; exec redis-server /tmp/redis.conf",
      ]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - redis_data:/data
    networks:
      - redis_internal

  worker-extraction:
    <<: *runtime-hardening
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
      args: *release-build-args
    env_file:
      - ${LOREVIA_ENV_FILE:-./backend/.env}
    environment:
      DEPLOYMENT_ENV: "production"
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
      DATABASE_STATEMENT_TIMEOUT_MS: "180000"
      DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: "60000"
      DATABASE_SLOW_QUERY_LOG_MS: "2000"
    command: python -m app.workers.worker_launcher extraction
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d worker-extraction@$$HOSTNAME --timeout=5 | grep -q OK || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app
      - redis_internal

  worker-analysis:
    <<: *runtime-hardening
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
      args: *release-build-args
    env_file:
      - ${LOREVIA_ENV_FILE:-./backend/.env}
    environment:
      DEPLOYMENT_ENV: "production"
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
      DATABASE_STATEMENT_TIMEOUT_MS: "180000"
      DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: "60000"
      DATABASE_SLOW_QUERY_LOG_MS: "2000"
    command: python -m app.workers.worker_launcher analysis
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d worker-analysis@$$HOSTNAME --timeout=5 | grep -q OK || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app
      - redis_internal

  worker-intelligence:
    <<: *runtime-hardening
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
      args: *release-build-args
    env_file:
      - ${LOREVIA_ENV_FILE:-./backend/.env}
    environment:
      DEPLOYMENT_ENV: "production"
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
      DATABASE_STATEMENT_TIMEOUT_MS: "60000"
      DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: "30000"
      DATABASE_SLOW_QUERY_LOG_MS: "1000"
    command: python -m app.workers.worker_launcher intelligence
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d worker-intelligence@$$HOSTNAME --timeout=5 | grep -q OK || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app
      - redis_internal

  worker-maintenance:
    <<: *runtime-hardening
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
      args: *release-build-args
    env_file:
      - ${LOREVIA_ENV_FILE:-./backend/.env}
    environment:
      DEPLOYMENT_ENV: "production"
      DATABASE_POOL_SIZE: "3"
      DATABASE_MAX_OVERFLOW: "2"
      DATABASE_STATEMENT_TIMEOUT_MS: "300000"
      DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: "60000"
      DATABASE_SLOW_QUERY_LOG_MS: "5000"
      MANUSCRIPT_EXPORT_SPOOL_DIRECTORY: "/var/lib/lorevia-export-spool"
    command: python -m app.workers.worker_launcher maintenance
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - export_spool:/var/lib/lorevia-export-spool
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,tempfile; f=tempfile.TemporaryFile(dir=os.environ['MANUSCRIPT_EXPORT_SPOOL_DIRECTORY']); f.close()\" && celery -A app.workers.celery_app inspect ping -d worker-maintenance@$$HOSTNAME --timeout=5 | grep -q OK || exit 1",
        ]
      interval: 60s
      timeout: 15s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app
      - redis_internal

  worker-embedding:
    <<: *runtime-hardening
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
      args: *release-build-args
    env_file:
      - ${LOREVIA_ENV_FILE:-./backend/.env}
    environment:
      DEPLOYMENT_ENV: "production"
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
      DATABASE_STATEMENT_TIMEOUT_MS: "180000"
      DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: "60000"
      DATABASE_SLOW_QUERY_LOG_MS: "2000"
    command: python -m app.workers.worker_launcher embedding
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d worker-embedding@$$HOSTNAME --timeout=5 | grep -q OK || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app
      - redis_internal

  celery-beat:
    <<: *runtime-hardening
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
      args: *release-build-args
    env_file:
      - ${LOREVIA_ENV_FILE:-./backend/.env}
    environment:
      DEPLOYMENT_ENV: "production"
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
      DATABASE_STATEMENT_TIMEOUT_MS: "30000"
      DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: "30000"
      DATABASE_SLOW_QUERY_LOG_MS: "1000"
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from pathlib import Path; import sys; sys.exit(0 if Path('/tmp/celerybeat-schedule').exists() else 1)\"",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app
      - redis_internal

  flower:
    <<: *runtime-hardening
    profiles: ["ops"]
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
      args: *release-build-args
    env_file:
      - ${LOREVIA_ENV_FILE:-./backend/.env}
    environment:
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
      DATABASE_STATEMENT_TIMEOUT_MS: "30000"
      DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: "30000"
      DATABASE_SLOW_QUERY_LOG_MS: "1000"
    command: celery -A app.workers.celery_app flower --port=5555
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5555:5555"
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app
      - redis_internal

networks:
  edge:
  app:
  redis_internal:
    internal: true

volumes:
  export_spool:
  redis_data:
