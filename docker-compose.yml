services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - edge
      - app

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.api
    # LOREVIA_ENV_FILE defaults to ./backend/.env for local/VPS use.
    # Override for managed deployments: set LOREVIA_ENV_FILE=/etc/lorevia/lorevia.env
    env_file:
      - ${LOREVIA_ENV_FILE:-./backend/.env}
    environment:
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app
      - redis_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Load REDIS_PASSWORD from the same env file used by the app services so
    # plain `docker compose up` works on a VPS without an extra --env-file flag.
    env_file:
      - ${LOREVIA_ENV_FILE:-./backend/.env}
    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$${REDIS_PASSWORD}\"",
      ]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - redis_data:/data
    networks:
      - redis_internal

  worker-extraction:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    env_file:
      - ${LOREVIA_ENV_FILE:-./backend/.env}
    environment:
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
    command: python -m app.workers.worker_launcher extraction
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d worker-extraction@$$HOSTNAME --timeout=5 | grep -q OK || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app
      - redis_internal

  worker-analysis:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    env_file:
      - ${LOREVIA_ENV_FILE:-./backend/.env}
    environment:
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
    command: python -m app.workers.worker_launcher analysis
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d worker-analysis@$$HOSTNAME --timeout=5 | grep -q OK || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app
      - redis_internal

  worker-intelligence:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    env_file:
      - ${LOREVIA_ENV_FILE:-./backend/.env}
    environment:
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
    command: python -m app.workers.worker_launcher intelligence
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d worker-intelligence@$$HOSTNAME --timeout=5 | grep -q OK || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app
      - redis_internal

  worker-embedding:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    env_file:
      - ${LOREVIA_ENV_FILE:-./backend/.env}
    environment:
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
    command: python -m app.workers.worker_launcher embedding
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d worker-embedding@$$HOSTNAME --timeout=5 | grep -q OK || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app
      - redis_internal

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    env_file:
      - ${LOREVIA_ENV_FILE:-./backend/.env}
    environment:
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from pathlib import Path; import sys; sys.exit(0 if Path('/tmp/celerybeat-schedule').exists() else 1)\"",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app
      - redis_internal

  flower:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    env_file:
      - ${LOREVIA_ENV_FILE:-./backend/.env}
    environment:
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
    command: celery -A app.workers.celery_app flower --port=5555
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5555:5555"
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app
      - redis_internal

networks:
  edge:
  app:
  redis_internal:
    internal: true

volumes:
  redis_data:
