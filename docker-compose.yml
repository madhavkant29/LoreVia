services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - edge
      - app

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.api
    env_file:
      - ./ops/env/backend.env
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app

  worker-extraction:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    env_file:
      - ./ops/env/backend.env
    command: sh -c 'celery -A app.workers.celery_app worker -n worker-extraction@%h -Q extraction,extraction_priority --loglevel=info -c $${EXTRACTION_CONCURRENCY:-1}'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d worker-extraction@$$HOSTNAME --timeout=5 | grep -q OK || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app

  worker-analysis:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    env_file:
      - ./ops/env/backend.env
    command: sh -c 'celery -A app.workers.celery_app worker -n worker-analysis@%h -Q analysis,analysis_priority,embedding --loglevel=info -c $${ANALYSIS_CONCURRENCY:-1}'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d worker-analysis@$$HOSTNAME --timeout=5 | grep -q OK || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app

  worker-intelligence:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    env_file:
      - ./ops/env/backend.env
    command: sh -c 'celery -A app.workers.celery_app worker -n worker-intelligence@%h -Q intelligence --loglevel=info -c $${INTELLIGENCE_CONCURRENCY:-1}'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d worker-intelligence@$$HOSTNAME --timeout=5 | grep -q OK || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    env_file:
      - ./ops/env/backend.env
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from pathlib import Path; import sys; sys.exit(0 if Path('/tmp/celerybeat-schedule').exists() else 1)\"",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app

  flower:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    env_file:
      - ./ops/env/backend.env
    command: celery -A app.workers.celery_app flower --port=5555
    restart: unless-stopped
    ports:
      - "127.0.0.1:5555:5555"
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app

networks:
  edge:
  app:
    internal: true
