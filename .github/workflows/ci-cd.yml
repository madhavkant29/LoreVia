name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

jobs:
  backend-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lorevia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-asyncio pytest-cov

    - name: Run Ruff linting
      run: |
        cd backend
        ruff check .

    - name: Run Ruff format check
      run: |
        cd backend
        ruff format --check .

    - name: Check pricing catalog drift
      run: |
        python backend/scripts/sync_pricing_catalog.py --check

    - name: Check production service contract
      run: |
        python backend/scripts/check_production_service_contract.py

    - name: Check repository for credentials
      run: |
        python backend/scripts/check_repository_secrets.py

    - name: Report repository hygiene
      continue-on-error: true
      run: |
        python backend/scripts/repo_hygiene_report.py

    - name: Download spaCy model
      run: |
        python -m spacy download en_core_web_sm

    - name: Run Alembic migrations
      env:
        ALEMBIC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorevia_test
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorevia_test
        REDIS_URL: redis://localhost:6379/0
        S3_BUCKET: test-bucket
        AWS_ACCESS_KEY_ID: test-key
        AWS_SECRET_ACCESS_KEY: test-secret
        OPENAI_API_KEY: test-key
        JWT_SECRET: test-secret-key-for-ci
        RESEND_API_KEY: test-key
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: "true"
        ALEMBIC_ALLOW_DESTRUCTIVE_UPGRADES: "1"
      run: |
        cd backend
        alembic upgrade head

    - name: Run tests
      env:
        RUN_CELERY_LIVE_TESTS: "1"
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorevia_test
        REDIS_URL: redis://localhost:6379/0
        S3_BUCKET: test-bucket
        AWS_ACCESS_KEY_ID: test-key
        AWS_SECRET_ACCESS_KEY: test-secret
        OPENAI_API_KEY: test-key
        JWT_SECRET: test-secret-key-for-ci
        RESEND_API_KEY: test-key
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: "true"
      run: |
        cd backend
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: backend/coverage.xml
        flags: backend
        name: backend-coverage

  frontend-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Run frontend unit tests and type checking
      run: |
        cd frontend
        npm run test
        npm run type-check
        npm run lint

    - name: Build application
      run: |
        cd frontend
        npm run build

  frontend-e2e:
    if: github.event_name == 'pull_request'
    name: Frontend E2E ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ['1', '2', '3', '4', 'author-audit', 'public-audit']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('frontend/package-lock.json') }}

    - name: Install Playwright browser
      run: |
        cd frontend
        npx playwright install --with-deps chromium

    - name: Run frontend E2E smoke tests
      env:
        CI: "true"
      run: |
        cd frontend
        if [ "${{ matrix.shard }}" = "author-audit" ]; then
          npm run test:e2e -- --grep "authenticated launch surfaces avoid"
        elif [ "${{ matrix.shard }}" = "public-audit" ]; then
          npm run test:e2e -- --grep "public launch surfaces avoid"
        else
          npm run test:e2e -- --fully-parallel --grep-invert "launch surfaces avoid" --shard=${{ matrix.shard }}/4
        fi

  security-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Enforce container configuration security
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: 'v0.74.0'
        scan-type: 'config'
        scan-ref: '.'
        scanners: 'misconfig'
        format: 'table'
        severity: 'HIGH,CRITICAL'
        exit-code: '1'

    - name: Generate Trivy SARIF report
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: 'v0.74.0'
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        limit-severities-for-sarif: true
        exit-code: '0'

    - name: Upload Trivy SARIF report
      if: always() && hashFiles('trivy-results.sarif') != ''
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy-filesystem'

    - name: Preserve Trivy SARIF report
      if: always() && hashFiles('trivy-results.sarif') != ''
      uses: actions/upload-artifact@v4
      with:
        name: trivy-sarif
        path: trivy-results.sarif
        retention-days: 14

    - name: Enforce vulnerability gate
      if: always()
      shell: python
      run: |
        import json
        from pathlib import Path

        report_path = Path("trivy-results.sarif")
        if not report_path.is_file():
            raise SystemExit("Trivy did not produce trivy-results.sarif")

        report = json.loads(report_path.read_text(encoding="utf-8"))
        findings = [
            result
            for run in report.get("runs", [])
            for result in run.get("results", [])
        ]
        if findings:
            rule_ids = sorted({
                str(result.get("ruleId") or "unknown")
                for result in findings
            })
            print(
                f"Trivy found {len(findings)} blocking HIGH/CRITICAL "
                f"finding(s): {', '.join(rule_ids)}"
            )
            raise SystemExit(1)

        print("Trivy found no blocking HIGH/CRITICAL findings.")

  container-image-scan:
    needs: [backend-tests, frontend-checks, frontend-e2e, security-scan]
    if: >-
      always() &&
      ((github.event_name == 'pull_request' &&
        needs.backend-tests.result == 'success' &&
        needs.frontend-checks.result == 'success' &&
        needs.frontend-e2e.result == 'success' &&
        needs.security-scan.result == 'success') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build backend release candidate
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./backend/Dockerfile.api
        load: true
        push: false
        tags: lorevia-backend-security:${{ github.sha }}
        build-args: |
          RELEASE_SHA=${{ github.sha }}
          SECURITY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
        cache-from: type=gha,scope=security-backend
        cache-to: type=gha,mode=max,scope=security-backend

    - name: Scan backend release candidate
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: 'v0.74.0'
        scan-type: 'image'
        image-ref: 'lorevia-backend-security:${{ github.sha }}'
        scanners: 'vuln'
        format: 'table'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        exit-code: '1'

    - name: Verify backend tokenizer is available offline
      run: >-
        docker run --rm --network none --read-only
        --tmpfs /tmp:rw,noexec,nosuid,nodev --cap-drop ALL
        --security-opt no-new-privileges:true
        lorevia-backend-security:${{ github.sha }}
        python -c "import tiktoken; tiktoken.encoding_for_model('gpt-4o-mini')"

    - name: Build worker release candidate
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./backend/Dockerfile.worker
        load: true
        push: false
        tags: lorevia-worker-security:${{ github.sha }}
        build-args: |
          RELEASE_SHA=${{ github.sha }}
          SECURITY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
        cache-from: type=gha,scope=security-worker
        cache-to: type=gha,mode=max,scope=security-worker

    - name: Scan worker release candidate
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: 'v0.74.0'
        scan-type: 'image'
        image-ref: 'lorevia-worker-security:${{ github.sha }}'
        scanners: 'vuln'
        format: 'table'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        exit-code: '1'

    - name: Verify worker tokenizer is available offline
      run: >-
        docker run --rm --network none --read-only
        --tmpfs /tmp:rw,noexec,nosuid,nodev --cap-drop ALL
        --security-opt no-new-privileges:true
        lorevia-worker-security:${{ github.sha }}
        python -c "import tiktoken; tiktoken.encoding_for_model('gpt-4o-mini')"

    - name: Verify worker image registration and live health probe
      shell: bash
      run: |
        set -euo pipefail
        network="lorevia-worker-smoke-${{ github.run_id }}"
        redis="lorevia-smoke-redis-${{ github.run_id }}"
        worker="lorevia-smoke-worker-${{ github.run_id }}"
        image="lorevia-worker-security:${{ github.sha }}"
        trap 'docker rm -f "$worker" "$redis" >/dev/null 2>&1 || true; docker network rm "$network" >/dev/null 2>&1 || true' EXIT
        docker network create "$network"
        docker run -d --name "$redis" --network "$network" redis:7-alpine
        docker run -d --name "$worker" --hostname smoke-worker --network "$network" \
          --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev \
          --cap-drop ALL --security-opt no-new-privileges:true \
          --health-cmd 'python -m app.workers.healthcheck extraction' \
          --health-interval 5s --health-timeout 15s --health-retries 2 \
          --health-start-period 5s \
          -e DEPLOYMENT_ENV=test \
          -e DATABASE_URL=postgresql://unused:unused@127.0.0.1:5432/unused \
          -e REDIS_URL="redis://$redis:6379/15" \
          -e CELERY_BROKER_URL="redis://$redis:6379/15" \
          -e S3_BUCKET=test -e AWS_ACCESS_KEY_ID=test -e AWS_SECRET_ACCESS_KEY=test \
          -e OPENAI_API_KEY=test -e JWT_SECRET=test-secret-key-for-ci \
          -e RESEND_API_KEY=test \
          "$image" python -m app.workers.worker_launcher extraction
        healthy=0
        for attempt in $(seq 1 30); do
          if docker exec "$worker" \
              python -m app.workers.healthcheck extraction; then
            healthy=1
            break
          fi
          sleep 2
        done
        test "$healthy" -eq 1
        for attempt in $(seq 1 15); do
          status="$(docker inspect --format '{{.State.Health.Status}}' "$worker")"
          [ "$status" = healthy ] && break
          sleep 2
        done
        test "$status" = healthy
        docker exec "$worker" celery -A app.workers.celery_app inspect registered \
          -d worker-extraction@smoke-worker --timeout=5 | grep -F extraction_tasks.process_book
        if docker exec -e HOSTNAME=wrong-worker "$worker" \
            python -m app.workers.healthcheck extraction; then
          echo "Wrong worker identity was accepted" >&2
          exit 1
        fi
        docker kill --signal=STOP "$worker" >/dev/null
        for attempt in $(seq 1 20); do
          status="$(docker inspect --format '{{.State.Health.Status}}' "$worker")"
          [ "$status" = unhealthy ] && break
          sleep 2
        done
        docker kill --signal=CONT "$worker" >/dev/null
        test "$status" = unhealthy
        for attempt in $(seq 1 20); do
          status="$(docker inspect --format '{{.State.Health.Status}}' "$worker")"
          [ "$status" = healthy ] && break
          sleep 2
        done
        test "$status" = healthy
        docker stop "$worker"
        if docker run --rm --network "$network" -e HOSTNAME=smoke-worker \
            -e CELERY_BROKER_URL="redis://$redis:6379/15" "$image" \
            python -m app.workers.healthcheck extraction; then
          echo "Stopped worker was reported healthy" >&2
          exit 1
        fi

    - name: Build Nginx release candidate
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./ops/nginx/Dockerfile
        load: true
        push: false
        tags: lorevia-nginx-security:${{ github.sha }}
        cache-from: type=gha,scope=security-nginx
        cache-to: type=gha,mode=max,scope=security-nginx

    - name: Scan Nginx release candidate
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: 'v0.74.0'
        scan-type: 'image'
        image-ref: 'lorevia-nginx-security:${{ github.sha }}'
        scanners: 'vuln'
        format: 'table'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        exit-code: '1'

    - name: Build Redis release candidate
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./ops/redis/Dockerfile
        load: true
        push: false
        tags: lorevia-redis-security:${{ github.sha }}
        cache-from: type=gha,scope=security-redis
        cache-to: type=gha,mode=max,scope=security-redis

    - name: Scan Redis release candidate
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: 'v0.74.0'
        scan-type: 'image'
        image-ref: 'lorevia-redis-security:${{ github.sha }}'
        scanners: 'vuln'
        format: 'table'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        exit-code: '1'

    - name: Build frontend release candidate
      uses: docker/build-push-action@v7
      with:
        context: ./frontend
        load: true
        push: false
        tags: lorevia-frontend-security:${{ github.sha }}
        build-args: |
          RELEASE_SHA=${{ github.sha }}
        cache-from: type=gha,scope=security-frontend
        cache-to: type=gha,mode=max,scope=security-frontend

    - name: Scan frontend release candidate
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: 'v0.74.0'
        scan-type: 'image'
        image-ref: 'lorevia-frontend-security:${{ github.sha }}'
        scanners: 'vuln'
        format: 'table'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        exit-code: '1'

  build-and-push-docker:
    needs: [container-image-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}/backend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push backend image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./backend/Dockerfile.api
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          RELEASE_SHA=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Extract metadata for frontend
      id: meta-frontend
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}/frontend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push frontend image
      uses: docker/build-push-action@v7
      with:
        context: ./frontend
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}
        build-args: |
          RELEASE_SHA=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
