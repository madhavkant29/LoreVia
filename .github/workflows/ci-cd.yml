name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lorevia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-asyncio pytest-cov

    - name: Run Ruff linting
      run: |
        cd backend
        ruff check .

    - name: Run Ruff format check
      run: |
        cd backend
        ruff format --check .

    - name: Check pricing catalog drift
      run: |
        python backend/scripts/sync_pricing_catalog.py --check

    - name: Report repository hygiene
      continue-on-error: true
      run: |
        python backend/scripts/repo_hygiene_report.py

    - name: Download spaCy model
      run: |
        python -m spacy download en_core_web_sm

    - name: Run Alembic migrations
      env:
        ALEMBIC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorevia_test
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorevia_test
        REDIS_URL: redis://localhost:6379/0
        S3_BUCKET: test-bucket
        AWS_ACCESS_KEY_ID: test-key
        AWS_SECRET_ACCESS_KEY: test-secret
        OPENAI_API_KEY: test-key
        JWT_SECRET: test-secret-key-for-ci
        RESEND_API_KEY: test-key
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: "true"
        ALEMBIC_ALLOW_DESTRUCTIVE_UPGRADES: "1"
      run: |
        cd backend
        alembic upgrade head

    - name: Run tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorevia_test
        REDIS_URL: redis://localhost:6379/0
        S3_BUCKET: test-bucket
        AWS_ACCESS_KEY_ID: test-key
        AWS_SECRET_ACCESS_KEY: test-secret
        OPENAI_API_KEY: test-key
        JWT_SECRET: test-secret-key-for-ci
        RESEND_API_KEY: test-key
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: "true"
      run: |
        cd backend
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: backend/coverage.xml
        flags: backend
        name: backend-coverage

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('frontend/package-lock.json') }}

    - name: Install Playwright browser
      run: |
        cd frontend
        npx playwright install --with-deps chromium

    - name: Run frontend unit tests and type checking
      run: |
        cd frontend
        npm run test
        npm run type-check
        npm run lint

    - name: Build application
      run: |
        cd frontend
        npm run build

    - name: Run frontend E2E smoke tests
      env:
        CI: "true"
      run: |
        cd frontend
        npm run test:e2e

  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Generate Trivy SARIF report
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        limit-severities-for-sarif: true
        exit-code: '0'

    - name: Upload Trivy SARIF report
      if: always() && hashFiles('trivy-results.sarif') != ''
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy-filesystem'

    - name: Preserve Trivy SARIF report
      if: always() && hashFiles('trivy-results.sarif') != ''
      uses: actions/upload-artifact@v4
      with:
        name: trivy-sarif
        path: trivy-results.sarif
        retention-days: 14

    - name: Enforce vulnerability gate
      if: always()
      shell: python
      run: |
        import json
        from pathlib import Path

        report_path = Path("trivy-results.sarif")
        if not report_path.is_file():
            raise SystemExit("Trivy did not produce trivy-results.sarif")

        report = json.loads(report_path.read_text(encoding="utf-8"))
        findings = [
            result
            for run in report.get("runs", [])
            for result in run.get("results", [])
        ]
        if findings:
            rule_ids = sorted({
                str(result.get("ruleId") or "unknown")
                for result in findings
            })
            print(
                f"Trivy found {len(findings)} blocking HIGH/CRITICAL "
                f"finding(s): {', '.join(rule_ids)}"
            )
            raise SystemExit(1)

        print("Trivy found no blocking HIGH/CRITICAL findings.")

  build-and-push-docker:
    needs: [backend-tests, frontend-tests, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}/backend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push backend image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./backend/Dockerfile.api
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Extract metadata for frontend
      id: meta-frontend
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}/frontend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push frontend image
      uses: docker/build-push-action@v7
      with:
        context: ./frontend
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
