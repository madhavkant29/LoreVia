name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lorevia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-asyncio pytest-cov

    - name: Download spaCy model
      run: |
        python -m spacy download en_core_web_sm

    - name: Run Alembic migrations
      env:
        ALEMBIC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorevia_test
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorevia_test
        REDIS_URL: redis://localhost:6379/0
        S3_BUCKET: test-bucket
        AWS_ACCESS_KEY_ID: test-key
        AWS_SECRET_ACCESS_KEY: test-secret
        OPENAI_API_KEY: test-key
        JWT_SECRET: test-secret-key-for-ci
        RESEND_API_KEY: test-key
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: "true"
        ALEMBIC_ALLOW_DESTRUCTIVE_UPGRADES: "1"
      run: |
        cd backend
        alembic upgrade head

    - name: Run tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorevia_test
        REDIS_URL: redis://localhost:6379/0
        S3_BUCKET: test-bucket
        AWS_ACCESS_KEY_ID: test-key
        AWS_SECRET_ACCESS_KEY: test-secret
        OPENAI_API_KEY: test-key
        JWT_SECRET: test-secret-key-for-ci
        RESEND_API_KEY: test-key
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: "true"
      run: |
        cd backend
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

    - name: Run blocking Ruff correctness checks
      run: |
        cd backend
        ruff check app --select E9,F63,F7,F82

    - name: Run full Ruff linting
      run: |
        cd backend
        ruff check .

    - name: Run Ruff format check
      run: |
        cd backend
        ruff format --check .

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: backend/coverage.xml
        flags: backend
        name: backend-coverage

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('frontend/package-lock.json') }}

    - name: Install Playwright browser
      run: |
        cd frontend
        npx playwright install --with-deps chromium

    - name: Run frontend unit tests and type checking
      run: |
        cd frontend
        npm run test
        npm run type-check

    - name: Build application
      run: |
        cd frontend
        npm run build

    - name: Run frontend E2E smoke tests
      env:
        CI: "true"
      run: |
        cd frontend
        npm run test:e2e

  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        exit-code: '1'

    - name: Upload Trivy SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'

  build-and-push-docker:
    needs: [backend-tests, frontend-tests, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}/backend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push backend image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./backend/Dockerfile.api
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Extract metadata for frontend
      id: meta-frontend
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}/frontend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push frontend image
      uses: docker/build-push-action@v7
      with:
        context: ./frontend
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: [build-and-push-docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
    - uses: actions/checkout@v6

    - name: Validate deployment secrets
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      run: |
        test -n "$VPS_HOST" || { echo "Missing production secret: VPS_HOST"; exit 1; }
        test -n "$VPS_USER" || { echo "Missing production secret: VPS_USER"; exit 1; }
        test -n "$VPS_SSH_KEY" || { echo "Missing production secret: VPS_SSH_KEY"; exit 1; }
        test -n "$VPS_KNOWN_HOSTS" || { echo "Missing production secret: VPS_KNOWN_HOSTS"; exit 1; }

    - name: Deploy to production
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/lorevia_deploy
        chmod 600 ~/.ssh/lorevia_deploy
        printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
        ssh -i ~/.ssh/lorevia_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
          "test -d /opt/lorevia/current && test -x /opt/lorevia/current/deploy.sh && command -v docker >/dev/null && command -v pg_dump >/dev/null"
        ssh -i ~/.ssh/lorevia_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
          "cd /opt/lorevia/current && bash -lc 'ENABLE_SYSTEMD_UNIT=0 ./deploy.sh'"

    - name: Verify production health
      run: |
        curl --fail --show-error --silent --retry 6 --retry-delay 5 https://api.getlorevia.com/health
        curl --fail --show-error --silent --retry 6 --retry-delay 5 https://api.getlorevia.com/ready
