name: Database Migrations

on:
  push:
    paths:
      - 'alembic/versions/**'
      - 'alembic/env.py'
      - 'backend/app/models/**'
  pull_request:
    paths:
      - 'alembic/versions/**'
      - 'alembic/env.py'
      - 'backend/app/models/**'

jobs:
  test-migrations:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lorevia_migration_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    
    - name: Create migration test database
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorevia_migration_test
      run: |
        cd backend
        alembic upgrade head
    
    - name: Test downgrade and upgrade
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorevia_migration_test
      run: |
        cd backend
        # Test downgrading
        alembic downgrade -1
        # Test upgrading back
        alembic upgrade head
        # Test all the way down and up
        alembic downgrade base
        alembic upgrade head
    
    - name: Check for migration conflicts
      run: |
        cd backend
        python -c "
import alembic.config
import alembic.script
from alembic.runtime.migration import MigrationContext
from sqlalchemy import create_engine

# Check for duplicate migration IDs
config = alembic.config.Config('alembic.ini')
script = alembic.script.ScriptDirectory.from_config(config)

heads = script.get_heads()
if len(heads) > 1:
    print('ERROR: Multiple migration heads detected. Migration branches need to be merged.')
    exit(1)

print('Migration structure is valid.')
"

  auto-migrate-staging:
    needs: test-migrations
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    
    - name: Run database migrations
      env:
        DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      run: |
        cd backend
        alembic upgrade head
    
    - name: Notify migration success
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#deployments'
        text: '✅ Database migrations completed successfully on staging!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  migrate-production:
    needs: test-migrations
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    
    - name: Create database backup
      env:
        DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      run: |
        cd backend
        # Create a backup before migrating
        python -c "
import os
from sqlalchemy import create_engine
from datetime import datetime

backup_name = f'pre_migration_backup_{datetime.now().strftime(\"%Y%m%d_%H%M%S\")}.sql'
print(f'Creating backup: {backup_name}')
# Add your backup logic here
"
    
    - name: Run database migrations
      env:
        DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      run: |
        cd backend
        alembic upgrade head
    
    - name: Verify migration success
      env:
        DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      run: |
        cd backend
        python -c "
from sqlalchemy import create_engine
from alembic.runtime.migration import MigrationContext
from alembic.config import Config
from alembic.script import ScriptDirectory

engine = create_engine(os.environ['DATABASE_URL'])
with engine.connect() as connection:
    context = MigrationContext.configure(connection)
    current_rev = context.get_current_revision()

config = Config('alembic.ini')
script = ScriptDirectory.from_config(config)
head_rev = script.get_current_head()

if current_rev != head_rev:
    print(f'ERROR: Migration failed. Current: {current_rev}, Expected: {head_rev}')
    exit(1)

print('Migration verification passed!')
"
    
    - name: Notify migration success
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#deployments'
        text: '✅ Database migrations completed successfully on production!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    
    - name: Notify migration failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#deployments'
        text: '❌ Database migrations failed on production!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
