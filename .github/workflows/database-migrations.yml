name: Database Migration Validation

on:
  push:
    paths:
      - 'backend/app/db/migrations/versions/**'
      - 'backend/app/db/migrations/env.py'
      - 'backend/app/models/**'
  pull_request:
    paths:
      - 'backend/app/db/migrations/versions/**'
      - 'backend/app/db/migrations/env.py'
      - 'backend/app/models/**'

permissions:
  contents: read
  actions: read

jobs:
  test-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lorevia_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Create migration test database
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorevia_migration_test
        REDIS_URL: redis://localhost:6379/0
        ALEMBIC_ALLOW_DESTRUCTIVE_UPGRADES: "1"
        S3_BUCKET: test-bucket
        AWS_ACCESS_KEY_ID: test-key
        AWS_SECRET_ACCESS_KEY: test-secret
        OPENAI_API_KEY: test-key
        JWT_SECRET: test-secret-key-for-migrations
        RESEND_API_KEY: test-key
      run: |
        cd backend
        alembic upgrade head

    - name: Test downgrade and upgrade
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorevia_migration_test
        REDIS_URL: redis://localhost:6379/0
        ALEMBIC_ALLOW_DESTRUCTIVE_UPGRADES: "1"
        ALEMBIC_ALLOW_DESTRUCTIVE_DOWNGRADES: "1"
        S3_BUCKET: test-bucket
        AWS_ACCESS_KEY_ID: test-key
        AWS_SECRET_ACCESS_KEY: test-secret
        OPENAI_API_KEY: test-key
        JWT_SECRET: test-secret-key-for-migrations
        RESEND_API_KEY: test-key
      run: |
        cd backend
        # Test a single-step rollback without doing a full schema reset.
        alembic downgrade -1
        alembic upgrade head

    - name: Check for migration conflicts
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorevia_migration_test
        REDIS_URL: redis://localhost:6379/0
        S3_BUCKET: test-bucket
        AWS_ACCESS_KEY_ID: test-key
        AWS_SECRET_ACCESS_KEY: test-secret
        OPENAI_API_KEY: test-key
        JWT_SECRET: test-secret-key-for-migrations
        RESEND_API_KEY: test-key
      run: |
        cd backend
        python -c "import alembic.config; import alembic.script; from alembic.runtime.migration import MigrationContext; from sqlalchemy import create_engine; config = alembic.config.Config('alembic.ini'); script = alembic.script.ScriptDirectory.from_config(config); heads = script.get_heads(); exit(1) if len(heads) > 1 else print('Migration structure is valid.')"
