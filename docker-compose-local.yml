services:
  api:
    build: { context: ./backend, dockerfile: Dockerfile.api }
    ports: ["8000:8000"]
    env_file: ./backend/.env.local
    depends_on: [redis, postgres]
    volumes:
      - local_storage:/app/storage

  worker-extraction:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    env_file: ./backend/.env.local
    depends_on: [redis, postgres]
    command: celery -A app.workers.celery_app worker -Q extraction -c 1 --loglevel=info
    volumes:
      - local_storage:/app/storage

  worker-analysis:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    env_file: ./backend/.env.local
    depends_on: [redis, postgres]
    command: celery -A app.workers.celery_app worker -Q analysis,embedding -c 1 --loglevel=info
    volumes:
      - local_storage:/app/storage

  worker-intelligence:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    env_file: ./backend/.env.local
    depends_on: [redis, postgres]
    command: celery -A app.workers.celery_app worker -Q intelligence -c 1 --loglevel=info
    volumes:
      - local_storage:/app/storage

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lorevia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  flower:
    image: mher/flower
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports: ["5555:5555"]
    depends_on: [redis]

volumes:
  postgres_data:
  local_storage:
