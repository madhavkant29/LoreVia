services:
  api:
    build: { context: ./backend, dockerfile: Dockerfile.api }
    ports: ["8000:8000"]
    env_file: ./backend/.env.local
    environment:
      NORMALIZE_LOCAL_STORAGE_PERMISSIONS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - local_storage:/app/storage

  worker-extraction:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    env_file: ./backend/.env.local
    environment:
      NORMALIZE_LOCAL_STORAGE_PERMISSIONS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - local_storage:/app/storage

  worker-analysis:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    env_file: ./backend/.env.local
    environment:
      NORMALIZE_LOCAL_STORAGE_PERMISSIONS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - local_storage:/app/storage

  worker-intelligence:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    env_file: ./backend/.env.local
    environment:
      NORMALIZE_LOCAL_STORAGE_PERMISSIONS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - local_storage:/app/storage

  migrate:
    build: { context: ./backend, dockerfile: Dockerfile.api }
    env_file: ./backend/.env.local
    environment:
      ALEMBIC_ALLOW_DESTRUCTIVE_UPGRADES: "1"
    depends_on:
      postgres:
        condition: service_healthy
    command: python scripts/bootstrap_db.py

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lorevia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lorevia"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  flower:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    env_file: ./backend/.env.local
    environment:
      NORMALIZE_LOCAL_STORAGE_PERMISSIONS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports: ["5555:5555"]
    volumes:
      - local_storage:/app/storage

volumes:
  postgres_data:
  local_storage:
