services:
  api:
    build: { context: ., dockerfile: backend/Dockerfile.api }
    ports: ["8000:8000"]
    env_file: ./backend/.env.local
    environment:
      NORMALIZE_LOCAL_STORAGE_PERMISSIONS: "1"
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lorevia_test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - local_storage:/app/storage
    networks:
      - default
      - redis_internal

  worker-extraction:
    build: { context: ., dockerfile: backend/Dockerfile.worker }
    command: python -m app.workers.worker_launcher extraction
    env_file: ./backend/.env.local
    environment:
      NORMALIZE_LOCAL_STORAGE_PERMISSIONS: "1"
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - local_storage:/app/storage
    networks:
      - default
      - redis_internal

  worker-analysis:
    build: { context: ., dockerfile: backend/Dockerfile.worker }
    command: python -m app.workers.worker_launcher analysis
    env_file: ./backend/.env.local
    environment:
      NORMALIZE_LOCAL_STORAGE_PERMISSIONS: "1"
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - local_storage:/app/storage
    networks:
      - default
      - redis_internal

  worker-embedding:
    build: { context: ., dockerfile: backend/Dockerfile.worker }
    command: python -m app.workers.worker_launcher embedding
    env_file: ./backend/.env.local
    environment:
      NORMALIZE_LOCAL_STORAGE_PERMISSIONS: "1"
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - local_storage:/app/storage
    networks:
      - default
      - redis_internal

  worker-intelligence:
    build: { context: ., dockerfile: backend/Dockerfile.worker }
    command: python -m app.workers.worker_launcher intelligence
    env_file: ./backend/.env.local
    environment:
      NORMALIZE_LOCAL_STORAGE_PERMISSIONS: "1"
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - local_storage:/app/storage
    networks:
      - default
      - redis_internal

  worker-maintenance:
    build: { context: ., dockerfile: backend/Dockerfile.worker }
    command: python -m app.workers.worker_launcher maintenance
    env_file: ./backend/.env.local
    environment:
      NORMALIZE_LOCAL_STORAGE_PERMISSIONS: "1"
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - local_storage:/app/storage
    networks:
      - default
      - redis_internal

  migrate:
    build: { context: ., dockerfile: backend/Dockerfile.api }
    env_file: ./backend/.env.local
    environment:
      ALEMBIC_ALLOW_DESTRUCTIVE_UPGRADES: "1"
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lorevia_test
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "python scripts/ensure_local_test_db.py && python scripts/bootstrap_db.py"
    networks:
      - default
      - redis_internal

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lorevia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lorevia"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    user: "999:1000"
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-dev-redis-password}
    command:
      [
        "sh",
        "-ec",
        "umask 077; printf 'appendonly yes\\nappendfsync everysec\\nrequirepass %s\\n' \"$${REDIS_PASSWORD}\" > /tmp/redis.conf; exec redis-server /tmp/redis.conf",
      ]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - redis_data:/data
    networks:
      - redis_internal

  flower:
    build: { context: ., dockerfile: backend/Dockerfile.worker }
    command: celery -A app.workers.celery_app flower --port=5555
    env_file: ./backend/.env.local
    environment:
      NORMALIZE_LOCAL_STORAGE_PERMISSIONS: "1"
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports: ["5555:5555"]
    volumes:
      - local_storage:/app/storage
    networks:
      - default
      - redis_internal

volumes:
  postgres_data:
  local_storage:
  redis_data:

networks:
  redis_internal:
    internal: true
