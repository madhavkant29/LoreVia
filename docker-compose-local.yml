services:
  api:
    build: { context: ./backend, dockerfile: Dockerfile.api }
    ports: ["8000:8000"]
    env_file: ./backend/.env.local
    environment:
      NORMALIZE_LOCAL_STORAGE_PERMISSIONS: "1"
    depends_on: [redis, postgres]
    volumes:
      - local_storage:/app/storage

  worker-extraction:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    env_file: ./backend/.env.local
    environment:
      NORMALIZE_LOCAL_STORAGE_PERMISSIONS: "1"
    depends_on: [redis, postgres]
    volumes:
      - local_storage:/app/storage

  worker-analysis:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    env_file: ./backend/.env.local
    environment:
      NORMALIZE_LOCAL_STORAGE_PERMISSIONS: "1"
    depends_on: [redis, postgres]
    volumes:
      - local_storage:/app/storage

  worker-intelligence:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    env_file: ./backend/.env.local
    environment:
      NORMALIZE_LOCAL_STORAGE_PERMISSIONS: "1"
    depends_on: [redis, postgres]
    volumes:
      - local_storage:/app/storage

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lorevia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  flower:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    env_file: ./backend/.env.local
    environment:
      NORMALIZE_LOCAL_STORAGE_PERMISSIONS: "1"
    depends_on: [redis, postgres]
    ports: ["5555:5555"]
    volumes:
      - local_storage:/app/storage

volumes:
  postgres_data:
  local_storage:
