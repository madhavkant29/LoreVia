services:
  api:
    build: { context: ./backend, dockerfile: Dockerfile.api }
    ports: ["8000:8000"]
    env_file: ./backend/.env.local
    depends_on: [redis, postgres]
    volumes:
      - local_storage:/app/storage

  worker:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    env_file: ./backend/.env.local
    depends_on: [redis, postgres]
    command: celery -A app.workers.celery_app worker -Q intelligence,analysis,embedding,extraction -c 4 -Ofair --loglevel=info
    volumes:
      - local_storage:/app/storage

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lorevia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  flower:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    env_file: ./backend/.env.local
    depends_on: [redis, postgres]
    command: celery -A app.workers.celery_app flower --port=5555
    ports: ["5555:5555"]
    volumes:
      - local_storage:/app/storage

volumes:
  postgres_data:
  local_storage:
